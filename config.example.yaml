# Runtime configuration for http-relay-gateway.
# The process polls this file each second and hot-reloads validated changes
# when its content hash changes. Copy it to config.yaml, replace the example
# relays with your real edge deployments, then start the service. Unknown or
# mistyped keys are rejected (strict decoding): a broken reload keeps the
# last-known-good configuration serving, and first boot refuses to start.
#
# The gateway is a general-purpose HTTP relay manager: any client that wants
# to hide its egress IP sends a relay-spec request (origin in X-Relay-Target,
# path+query in X-Relay-Path) to the gateway root — optionally /{provider} —
# and the gateway forwards it verbatim to a health-aware round-robin pick
# among the relays below. There is no authentication: keep the endpoint
# inside the internal network.

# Application log threshold: debug, info, warn, or error.
log-level: info

# Total relay attempts per request. A transport error (connection refused,
# TLS failure, timeout before any response byte) moves to the next pick; a
# response that already started streaming is never retried.
max-retries: 2

# Passive health: after this many consecutive failures a relay cools down and
# is skipped until the cooldown expires, then admitted again (half-open).
failure-threshold: 3
cooldown: 30s

# Per-provider request-body limits enforced by the edge platforms themselves:
# Vercel serverless functions reject bodies over ~4.5 MB, Cloudflare Workers
# accept up to ~100 MB. The gateway buffers a request body up to the largest
# configured limit and skips relays whose provider limit the body exceeds, so
# an oversized request routes to a provider that accepts it instead of dying
# at the edge. Values accept whole byte counts (4500000) or size strings
# ("4.5mb" decimal / "8MiB" binary). A provider without an entry gets the
# built-in default (8MiB).
providers:
  vercel:
    max-body: 4.5mb
  cloudflare:
    max-body: 100mb
  # deno:            # uncomment once a deno relay exists; e.g. max-body: 50mb

# The edge relay pool. `provider` is a free label (vercel, cloudflare, deno,
# ...) grouping relays for pinning via X-Relay-Provider or the /{provider}
# path prefix; the reserved labels "" / all / none / auto and the gateway's
# own endpoints (healthz, stats) are rejected. URLs must be absolute
# http(s). `name` is optional (defaults to provider-index) and must be
# unique; `active: false` removes a relay from rotation without deleting it.
relays:
  - name: vercel-1
    provider: vercel
    url: https://my-relay.vercel.app
  - name: cloudflare-1
    provider: cloudflare
    url: https://my-relay.example.workers.dev
  # - name: vercel-2
  #   provider: vercel
  #   url: https://my-relay-2.vercel.app
  #   active: false
